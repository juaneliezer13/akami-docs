# 🐳 Docker Compose — Ambiente Staging
# Akami K-Beauty — Servicio web en puerto 23000

services:
  web_akami:
    build:
      context: ../../akami-web
      dockerfile: Dockerfile
    image: juaneliezer13/akamikbeauty:staging
    container_name: cliente_akami_staging
    restart: unless-stopped
    ports:
      - "${PORT:-23000}:80"
    volumes:
      - ../../akami-web/html:/usr/share/nginx/html:ro
      - ../../akami-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=America/Caracas
